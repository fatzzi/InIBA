name: PR rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-rules:
    name: PR rules
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name, target and Jira key
        env:
          # Passed through env, never interpolated into the script, so a crafted
          # branch name or PR title can't inject shell.
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail=0
          branch_re='^(feature|fix|chore|docs)/(SCRUM-[0-9]+(-[0-9]+)*-)?[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$HEAD_REF" =~ $branch_re ]]; then
            echo "::error::Branch '$HEAD_REF' must look like feature/SCRUM-19-register (prefixes: feature, fix, chore, docs; lowercase words joined by hyphens)."
            fail=1
          fi
          if [[ "$BASE_REF" != "main" ]]; then
            echo "::error::Pull requests must target main, not '$BASE_REF'."
            fail=1
          fi
          if [[ ! "$HEAD_REF $PR_TITLE" =~ SCRUM-[0-9]+ ]]; then
            echo "::error::Put the Jira key (e.g. SCRUM-19) in the branch name or the PR title."
            fail=1
          fi
          exit $fail
