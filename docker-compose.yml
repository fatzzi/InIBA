# Local development database. Start with:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iniba
      POSTGRES_PASSWORD: iniba
      POSTGRES_DB: iniba
    ports:
      - "5432:5432"
    volumes:
      - iniba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iniba"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iniba_pgdata:
